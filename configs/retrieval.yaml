# EvidenceScholar retrieval configuration.
# 所有检索器（BM25 / Dense / Hybrid）的参数都从这里读取。

hf:
  # 国内无法直连 huggingface.co，必须走镜像。
  endpoint: https://hf-mirror.com
  cache_dir: ~/.cache/huggingface

bm25:
  k1: 1.5
  b: 0.75
  title_weight: 2
  top_k: 10

dense:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 64
  normalize_embeddings: true
  device: cuda:0      # 8×RTX 3090，先用第 0 张
  top_k: 10
  index_path: data/indexes/hotpotqa_dense.faiss

hybrid:
  method: rrf            # 融合策略：rrf（倒数排名融合）
  rrf_k: 60              # RRF 平滑常数，论文默认值
  top_k: 10

reranker:
  model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
  device: cuda:0          # 与 dense 同卡，MiniLM-L6 显存占用极小
  max_length: 512         # cross-encoder 输入截断长度
  candidate_k: 10         # 第一阶段召回的候选数，reranker 对其重排
