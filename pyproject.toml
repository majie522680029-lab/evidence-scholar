[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-scholar"
version = "0.1.0"
description = "An evidence-grounded agent for literature research and academic review writing."
readme = "README.md"
requires-python = ">=3.10,<3.13"

dependencies = [
    "pydantic>=2.8,<3.0",
    "PyYAML>=6.0,<7.0",
    "numpy>=1.26,<3.0",
    "faiss-gpu-cu12>=1.14,<2.0",
    "sentence-transformers>=6.0,<7.0",
    "openai>=1.0,<4.0",  # 调 vLLM 的 OpenAI 兼容 API（B1 起服务，B3 调用）
    # torch 由 sentence-transformers 间接拉取；如需 CUDA 版，
    # 须用: pip install torch --index-url https://download.pytorch.org/whl/cu121
    "mcp>=2.1,<2.2",  # C1 MCP server（MCPServer，2.x 把 FastMCP 改名）
    "langgraph>=1.2,<1.3",  # C2 LangGraph 重写（StateGraph，1.2.x API）
    "redis>=5.0,<9.0",  # C4 语义缓存（服务端 conda 装的 redis-server 5.0）
    "psycopg2-binary>=2.9,<3.0",  # C4 PG 持久化（服务端 conda 装的 postgres 16）
    "fastapi>=0.110,<0.120",  # C4 API 服务
    "uvicorn[standard]>=0.29,<0.40",  # C4 ASGI server
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<0.25",  # C1 MCP 测试用 async（call_tool 是协程）
    "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"  # C1 MCP 测试 async，auto 模式自动识别 async def 测试

[tool.ruff]
line-length = 100
target-version = "py310"
